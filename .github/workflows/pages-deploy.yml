name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure Pages BEFORE the build so `base_path` (which reflects the
      # Pages subpath, e.g. /ai-agent-studio/) feeds into VITE_BASE_PATH.
      # Without this, asset URLs resolve from the wrong root and 404.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_CHAT_API_URL: https://ai-agent-studio-proxy.sisun-ai.workers.dev
          # Supabase publishable (anon) key — safe to ship to the client,
          # guarded by RLS policies (see web/src/features/review/schema.sql).
          # The service_role key is never used.
          VITE_SUPABASE_URL: https://ddtwkthkyseukvpileck.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkdHdrdGhreXNldWt2cGlsZWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MDIyMjksImV4cCI6MjA5MjM3ODIyOX0.j8NcfCP6bmG7RCqyNHm6LfoNvyK-FbpLqLWbj8UqocU
        run: |
          echo "Pages base_path: $VITE_BASE_PATH"
          npm run build

      - name: Prepare for GitHub Pages
        working-directory: web/dist
        run: |
          # Skip Jekyll post-processing (preserves files/dirs starting with _).
          touch .nojekyll
          # SPA fallback: serve index.html for unknown routes / deep links.
          cp index.html 404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
