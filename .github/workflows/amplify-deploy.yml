name: Deploy to AWS Amplify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: amplify-deploy
  cancel-in-progress: false

jobs:
  ensure-app:
    uses: webexdesign/.github/.github/workflows/amplify-deploy.yml@main
    with:
      app_name: ai-agent-studio
      access_control: public
      action: create-or-update
      branch: main
      aws_region: us-west-2
      framework: "React - Vite"
      build_command: "npm run build"
      output_dir: dist
      # Note: VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY are the Supabase
      # publishable (anon) key pair. They are designed to be shipped to the
      # client and are protected by Row Level Security policies defined in
      # web/src/features/review/schema.sql. The service_role key is never
      # used in this app.
      environment_variables_json: '{"VITE_CHAT_API_URL":"https://ai-agent-studio-proxy.sisun-ai.workers.dev","VITE_SUPABASE_URL":"https://ddtwkthkyseukvpileck.supabase.co","VITE_SUPABASE_ANON_KEY":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkdHdrdGhreXNldWt2cGlsZWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MDIyMjksImV4cCI6MjA5MjM3ODIyOX0.j8NcfCP6bmG7RCqyNHm6LfoNvyK-FbpLqLWbj8UqocU"}'
      enable_branch_auto_build: false
    secrets: inherit

  build-and-deploy:
    needs: ensure-app
    if: always()
    runs-on: ${{ github.repository_owner }}-amd64-runners
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_CHAT_API_URL: https://ai-agent-studio-proxy.sisun-ai.workers.dev
          # Supabase publishable (anon) key — safe to ship to the client,
          # guarded by RLS policies (see web/src/features/review/schema.sql).
          VITE_SUPABASE_URL: https://ddtwkthkyseukvpileck.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkdHdrdGhreXNldWt2cGlsZWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MDIyMjksImV4cCI6MjA5MjM3ODIyOX0.j8NcfCP6bmG7RCqyNHm6LfoNvyK-FbpLqLWbj8UqocU

      - name: Configure AWS credentials
        uses: cisco-actions/configure-aws-credentials@1a221e28f5827bb587dec3ac0ba9a95d01e806e8
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Deploy pre-built artifacts to Amplify
        run: |
          set -euo pipefail
          APP_NAME="ai-agent-studio"
          BRANCH="main"

          APP_ID=$(aws amplify list-apps --query "apps[?name=='${APP_NAME}'].appId" --output text)
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "None" ]; then
            echo "::error::Could not find Amplify app '${APP_NAME}'"
            exit 1
          fi
          echo "Found Amplify app: $APP_ID"

          echo "--- Disabling auto-build (we deploy pre-built artifacts) ---"
          aws amplify update-branch \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --no-enable-auto-build 2>/dev/null || true

          echo "--- Configuring SPA redirect rules ---"
          aws amplify update-app \
            --app-id "$APP_ID" \
            --custom-rules '[{"source":"</^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>","status":"200","target":"/index.html"}]'

          echo "--- Zipping build artifacts ---"
          cd web/dist
          zip -qr ../../deploy.zip .
          cd ../..
          echo "Archive size: $(du -h deploy.zip | cut -f1)"

          echo "--- Creating deployment ---"
          DEPLOYMENT=$(aws amplify create-deployment \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH")

          JOB_ID=$(echo "$DEPLOYMENT" | python3 -c "import sys,json; print(json.load(sys.stdin)['jobId'])")
          ZIP_URL=$(echo "$DEPLOYMENT" | python3 -c "import sys,json; print(json.load(sys.stdin)['zipUploadUrl'])")
          echo "Created deployment job: $JOB_ID"

          echo "--- Uploading artifacts ---"
          curl --fail --silent --show-error -T deploy.zip "$ZIP_URL"
          echo "Upload complete"

          echo "--- Starting deployment ---"
          aws amplify start-deployment \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --job-id "$JOB_ID"
          echo "Deployment started"

          echo ""
          echo "Deployment URL: https://main.${APP_ID}.amplifyapp.com"
