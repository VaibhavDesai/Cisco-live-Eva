name: AWS Amplify Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      access_control:
        description: 'Access control for the app'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - restricted
      basic_auth_username:
        description: 'Username for basic auth (required when access_control is restricted)'
        required: false
        type: string
      basic_auth_password:
        description: 'Password for basic auth (required when access_control is restricted, at least 7 characters)'
        required: false
        type: string
      action:
        description: 'Action to perform'
        required: true
        default: 'create-or-update'
        type: choice
        options:
          - create-or-update
          - delete        
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string
      aws_region:
        description: 'AWS region'
        required: true
        default: 'us-west-2'
        type: choice
        options:
          - us-east-1
          - us-east-2
          - us-west-2
      framework:
        description: 'Framework preset'
        required: true
        default: 'React - Vite'
        type: choice
        options:
          - 'React - Vite'
          - 'React'
          - 'Next.js'
          - 'Vue'
          - 'Angular'
          - 'Web'
      build_command:
        description: 'Build command (leave empty for Web - plain HTML/CSS/JS sites)'
        required: false
        default: 'npm run build'
        type: string
      output_dir:
        description: 'Build output directory (use . for Web - plain HTML/CSS/JS sites)'
        required: false
        default: 'dist'
        type: string
      environment_variables_json:
        description: 'Amplify environment variables JSON, for example {"API_URL":"https://example.com"}'
        required: false
        default: '{}'
        type: string
      app_name:
        description: 'Amplify app name, defaults to repository name if not provided'
        required: false
        type: string        
      enable_branch_auto_build:
        description: 'Enable auto build on branch push'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  deploy-amplify:
    uses: webexdesign/.github/.github/workflows/amplify-deploy.yml@main
    with:
      app_name: ${{ inputs.app_name || github.event.repository.name }}
      access_control: ${{ inputs.access_control || 'public' }}
      basic_auth_username: ${{ inputs.basic_auth_username || '' }}
      basic_auth_password: ${{ inputs.basic_auth_password || '' }}
      action: ${{ inputs.action || 'create-or-update' }}
      branch: ${{ inputs.branch || 'main' }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
      framework: ${{ inputs.framework || 'React - Vite' }}
      build_command: ${{ inputs.build_command || 'npm run build' }}
      output_dir: ${{ inputs.output_dir || 'dist' }}
      environment_variables_json: ${{ inputs.environment_variables_json || '{}' }}
      enable_branch_auto_build: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_branch_auto_build) }}
    secrets: inherit

  trigger-build:
    needs: deploy-amplify
    if: ${{ (inputs.action || 'create-or-update') == 'create-or-update' }}
    runs-on: ${{ github.repository_owner }}-amd64-runners
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Configure AWS credentials
        uses: cisco-actions/configure-aws-credentials@1a221e28f5827bb587dec3ac0ba9a95d01e806e8
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region || 'us-west-2' }}

      - name: Trigger Amplify build and wait
        run: |
          set -euo pipefail
          APP_NAME="${{ inputs.app_name || github.event.repository.name }}"
          BRANCH="${{ inputs.branch || 'main' }}"
          REGION="${{ inputs.aws_region || 'us-west-2' }}"

          APP_ID=$(aws amplify list-apps --query "apps[?name=='${APP_NAME}'].appId" --output text)
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "None" ]; then
            echo "::error::Could not find Amplify app '${APP_NAME}'"
            exit 1
          fi
          echo "Found Amplify app: $APP_ID"

          JOB_ID=$(aws amplify start-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-type RELEASE --query 'jobSummary.jobId' --output text 2>/dev/null) || true
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "None" ]; then
            echo "A build is already running — monitoring existing job"
            JOB_ID=$(aws amplify list-jobs --app-id "$APP_ID" --branch-name "$BRANCH" --max-results 1 --query 'jobSummaries[0].jobId' --output text)
          else
            echo "Started new Amplify build: job $JOB_ID"
          fi

          echo "Waiting for build to complete..."
          for i in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" --query 'job.summary.status' --output text)
            echo "  [$i] Status: $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then
              echo "✅ Amplify build succeeded!"
              echo "🔗 https://main.${APP_ID}.amplifyapp.com"
              exit 0
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "::error::Amplify build ${STATUS}"
              aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" --query 'job.steps[*].{step:stepName,status:status,reason:statusReason}' --output table
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Amplify build"
          exit 1
