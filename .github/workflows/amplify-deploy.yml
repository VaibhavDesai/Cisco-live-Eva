name: AWS Amplify Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      access_control:
        description: 'Access control for the app'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - restricted
      basic_auth_username:
        description: 'Username for basic auth (required when access_control is restricted)'
        required: false
        type: string
      basic_auth_password:
        description: 'Password for basic auth (required when access_control is restricted, at least 7 characters)'
        required: false
        type: string
      action:
        description: 'Action to perform'
        required: true
        default: 'create-or-update'
        type: choice
        options:
          - create-or-update
          - delete        
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string
      aws_region:
        description: 'AWS region'
        required: true
        default: 'us-west-2'
        type: choice
        options:
          - us-east-1
          - us-east-2
          - us-west-2
      framework:
        description: 'Framework preset'
        required: true
        default: 'React - Vite'
        type: choice
        options:
          - 'React - Vite'
          - 'React'
          - 'Next.js'
          - 'Vue'
          - 'Angular'
          - 'Web'
      build_command:
        description: 'Build command (leave empty for Web - plain HTML/CSS/JS sites)'
        required: false
        default: 'npm run build'
        type: string
      output_dir:
        description: 'Build output directory (use . for Web - plain HTML/CSS/JS sites)'
        required: false
        default: 'dist'
        type: string
      environment_variables_json:
        description: 'Amplify environment variables JSON, for example {"API_URL":"https://example.com"}'
        required: false
        default: '{}'
        type: string
      app_name:
        description: 'Amplify app name, defaults to repository name if not provided'
        required: false
        type: string        
      enable_branch_auto_build:
        description: 'Enable auto build on branch push'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  deploy-amplify:
    uses: webexdesign/.github/.github/workflows/amplify-deploy.yml@main
    with:
      app_name: ${{ inputs.app_name || github.event.repository.name }}
      access_control: ${{ inputs.access_control || 'public' }}
      basic_auth_username: ${{ inputs.basic_auth_username || '' }}
      basic_auth_password: ${{ inputs.basic_auth_password || '' }}
      action: ${{ inputs.action || 'create-or-update' }}
      branch: ${{ inputs.branch || 'main' }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
      framework: ${{ inputs.framework || 'React - Vite' }}
      build_command: ${{ inputs.build_command || 'npm run build' }}
      output_dir: ${{ inputs.output_dir || 'dist' }}
      environment_variables_json: ${{ inputs.environment_variables_json || '{}' }}
      enable_branch_auto_build: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_branch_auto_build) }}
    secrets: inherit

  trigger-build:
    needs: deploy-amplify
    if: ${{ (inputs.action || 'create-or-update') == 'create-or-update' }}
    runs-on: ${{ github.repository_owner }}-amd64-runners
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Configure AWS credentials
        uses: cisco-actions/configure-aws-credentials@1a221e28f5827bb587dec3ac0ba9a95d01e806e8
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region || 'us-west-2' }}

      - name: Diagnose and trigger Amplify build
        run: |
          set -euo pipefail
          APP_NAME="${{ inputs.app_name || github.event.repository.name }}"
          BRANCH="${{ inputs.branch || 'main' }}"

          APP_ID=$(aws amplify list-apps --query "apps[?name=='${APP_NAME}'].appId" --output text)
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "None" ]; then
            echo "::error::Could not find Amplify app '${APP_NAME}'"
            exit 1
          fi
          echo "Found Amplify app: $APP_ID"

          echo "--- App details ---"
          aws amplify get-app --app-id "$APP_ID" --query 'app.{repository:repository,platform:platform,buildSpec:buildSpec}' --output json 2>/dev/null || echo "(get-app not available)"

          echo "--- Branch details ---"
          aws amplify get-branch --app-id "$APP_ID" --branch-name "$BRANCH" \
            --query 'branch.{enableAutoBuild:enableAutoBuild,activeJobId:activeJobId,totalNumberOfJobs:totalNumberOfJobs,stage:stage}' \
            --output json 2>/dev/null || echo "(get-branch not available)"

          echo "--- Triggering RELEASE build ---"
          if JOB_OUTPUT=$(aws amplify start-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-type RELEASE --commit-id "${{ github.sha }}" --commit-message "Deploy ${{ github.sha }}" 2>&1); then
            JOB_ID=$(echo "$JOB_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['jobSummary']['jobId'])")
            echo "✅ Started Amplify build: job $JOB_ID (commit ${{ github.sha }})"
            echo "🔗 https://main.${APP_ID}.amplifyapp.com"
          else
            if echo "$JOB_OUTPUT" | grep -q "already have pending or running"; then
              echo "⏳ A build is already running on Amplify."
              echo "🔗 https://main.${APP_ID}.amplifyapp.com"
            else
              echo "::error::Failed to start build: $JOB_OUTPUT"
              exit 1
            fi
          fi
