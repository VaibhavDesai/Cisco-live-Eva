<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // SPA fallback for GitHub Pages
      // Stores the requested path and redirects to the root so the app can
      // restore it via client-side routing.
      sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
      location.replace('/');
    </script>
  </head>
  <body></body>
</html>
