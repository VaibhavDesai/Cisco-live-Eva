        icon: notes-bold
      - id: ai3-privacy-audit-analytics
        path: privacy-analytics
        screen: Ai3PrivacyAuditAnalyticsScreen
        label: Privacy and analytics
        icon: shield-bold
  - id: ai-assistant-skills
    path: /ai-assistant-skills
