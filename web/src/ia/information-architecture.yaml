      - id: ai3-supervisor-admin
        path: supervisor-admin
        screen: Ai3SupervisorAdminScreen
        label: Supervisor and admin
        icon: settings-bold
      - id: ai3-knowledge-manager
        path: knowledge-manager
        screen: Ai3KnowledgeManagerScreen
