    path: /integrations
    screen: IntegrationsScreen
    label: Integrations
    icon: integrations-bold
  - id: preferences
    path: /preferences
    screen: PreferencesFormScreen
    label: Preferences
    icon: settings-bold
  - id: filters
    path: /filters
    screen: FiltersScreen
    label: Filters
    icon: filter-bold
  - id: settings
    path: /settings
    label: Settings
    icon: settings-bold
    children:
      - id: profile
        path: profile
        screen: ProfileScreen
        label: Profile
        icon: user-bold
      - id: voice
